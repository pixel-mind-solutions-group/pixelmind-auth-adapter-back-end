<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 1200px;
    background-color: #070B14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 75%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c6-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Modernist Minimal Monogram 'mO' -->
  <!-- Left stem of 'm' -->
  <rect x="18" y="28" width="12" height="48" rx="6" fill="#2563EB"/>
  
  <!-- Bridge and center stem of 'm' -->
  <path d="M 24 44 C 24 32, 38 32, 38 44 L 38 76" 
        fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>

  <!-- Right 'O' Ring seamlessly interlocking -->
  <circle cx="68" cy="52" r="22" fill="none" stroke="#00D2D3" stroke-width="11"/>
  <circle cx="68" cy="52" r="7" fill="#2563EB"/>
</svg>

</div>
</body>
</html>
