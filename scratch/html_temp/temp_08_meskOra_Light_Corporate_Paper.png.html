<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 2400px;
    height: 700px;
    background-color: #FFFFFF;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="100%" height="100%">
  <defs>
    <linearGradient id="light-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="light-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Crisp Light / White Background Canvas -->
  <rect width="100%" height="100%" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Symbol -->
  <g transform="translate(24, 15) scale(0.9)">
    <!-- Left arch of 'm' -->
    <path d="M 22 74 L 22 42 C 22 26, 38 26, 38 42 L 38 74" 
          fill="none" 
          stroke="url(#light-cyan-blue)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right loop forming 'O' -->
    <path d="M 38 48 
             C 38 30, 54 24, 68 24 
             C 83 24, 93 36, 93 51 
             C 93 66, 83 78, 68 78 
             C 53 78, 43 66, 43 51 
             C 43 42, 48 35, 57 29" 
          fill="none" 
          stroke="url(#light-blue-deep)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <circle cx="68" cy="51" r="5" fill="#0284C7"/>
  </g>

  <!-- High-Contrast Corporate Typography -->
  <g transform="translate(130, 0)">
    <text x="0" y="65" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#0B132B">mesk</tspan><tspan fill="#2563EB">O</tspan><tspan fill="#0B132B">ra</tspan>
    </text>

    <text x="2" y="93" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="600" 
          letter-spacing="3.4" 
          fill="#475569">
      Technologies (Pvt) Ltd
    </text>
  </g>
</svg>

</div>
</body>
</html>
