<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 1200px;
    background-color: #070B14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 75%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c5-poly1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="c5-poly2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Precision Dual-Fold Architectural Poly 'M' -->
  <!-- Left Wing -->
  <polygon points="18,78 18,34 38,18 48,30 36,40 36,78" fill="url(#c5-poly1)"/>
  
  <!-- Right Wing -->
  <polygon points="52,30 62,18 82,34 82,78 64,78 64,40" fill="url(#c5-poly2)"/>

  <!-- Center Suspended Geometric Core 'O' -->
  <circle cx="50" cy="56" r="12" fill="#0F172A" stroke="#00D2D3" stroke-width="4"/>
  <circle cx="50" cy="56" r="5" fill="#38BDF8"/>
</svg>

</div>
</body>
</html>
