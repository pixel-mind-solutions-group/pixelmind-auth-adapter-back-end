<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 1200px;
    background-color: #070B14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 75%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c3-bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="c3-bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00D2D3"/>
    </linearGradient>
  </defs>

  <!-- 3 Ascending dynamic modular chevrons representing 'm' growth -->
  <rect x="18" y="44" width="14" height="38" rx="7" fill="url(#c3-bar1)"/>
  <rect x="38" y="32" width="14" height="50" rx="7" fill="url(#c3-bar2)"/>
  <rect x="58" y="20" width="14" height="62" rx="7" fill="url(#c3-bar3)"/>
  
  <!-- The Apex Orb 'O' (Visionary Destination / Target) -->
  <circle cx="82" cy="20" r="9" fill="#00D2D3"/>
  <circle cx="82" cy="20" r="4" fill="#FFFFFF"/>
</svg>

</div>
</body>
</html>
