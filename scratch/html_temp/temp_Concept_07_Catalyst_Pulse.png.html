<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 1200px;
    background-color: #070B14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 75%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c7-orbit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c7-orbit2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Elliptical Orbits tilted at 45 & -45 degrees -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#c7-orbit1)" stroke-width="7" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#c7-orbit2)" stroke-width="7" transform="rotate(30 50 50)"/>
  
  <!-- Central Catalyst Core Sphere 'O' -->
  <circle cx="50" cy="50" r="10" fill="#00D2D3"/>
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>

</div>
</body>
</html>
