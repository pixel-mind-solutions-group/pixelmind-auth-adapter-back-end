<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 1200px;
    background-color: #070B14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 75%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c1-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c1-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00D2D3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Continuous "mO" Möbius Ribbon Concept -->
  <!-- Left arch of 'm' -->
  <path d="M 22 72 
           L 22 42 
           C 22 28, 38 28, 38 42 
           L 38 72" 
        fill="none" 
        stroke="url(#c1-cyan-blue)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#c1-glow)"/>

  <!-- Right loop forming 'O' and completing 'm' flow -->
  <path d="M 38 48 
           C 38 32, 54 26, 68 26 
           C 82 26, 92 37, 92 51 
           C 92 65, 82 76, 68 76 
           C 54 76, 44 65, 44 51 
           C 44 43, 48 37, 56 31" 
        fill="none" 
        stroke="url(#c1-blue-deep)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Intersecting focal point node (Intelligent transformation core) -->
  <circle cx="68" cy="51" r="5" fill="#00D2D3"/>
</svg>

</div>
</body>
</html>
