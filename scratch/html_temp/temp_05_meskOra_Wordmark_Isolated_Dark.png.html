<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 2200px;
    height: 600px;
    background-color: #0A192F;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  }
  .svg-container {
    width: 90%;
    height: 90%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="svg-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" width="100%" height="100%">
  <!-- Standalone meskOra Typographic Wordmark -->
  <g transform="translate(10, 0)">
    <!-- Primary Brand Name: meskOra -->
    <text x="0" y="46" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="48" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#0F172A">mesk</tspan><tspan fill="#2563EB">O</tspan><tspan fill="#0F172A">ra</tspan>
    </text>

    <!-- Supporting Corporate Line -->
    <text x="2" y="70" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="500" 
          letter-spacing="3.4" 
          fill="#475569">
      Technologies (Pvt) Ltd
    </text>
  </g>
</svg>

</div>
</body>
</html>
