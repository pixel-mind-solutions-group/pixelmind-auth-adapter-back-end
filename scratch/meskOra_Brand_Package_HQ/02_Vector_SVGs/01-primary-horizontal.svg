<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="100%" height="100%">
  <defs>
    <linearGradient id="prim-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="prim-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <filter id="prim-subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Group: Symbol (mO Möbius Nexus) -->
  <g transform="translate(16, 15) scale(0.9)" filter="url(#prim-subtle-shadow)">
    <!-- Left arch of 'm' -->
    <path d="M 22 74 L 22 42 C 22 26, 38 26, 38 42 L 38 74" 
          fill="none" 
          stroke="url(#prim-cyan-blue)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right loop forming 'O' and completing 'm' flow -->
    <path d="M 38 48 
             C 38 30, 54 24, 68 24 
             C 83 24, 93 36, 93 51 
             C 93 66, 83 78, 68 78 
             C 53 78, 43 66, 43 51 
             C 43 42, 48 35, 57 29" 
          fill="none" 
          stroke="url(#prim-blue-deep)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Dynamic Innovation Core Node -->
    <circle cx="68" cy="51" r="5" fill="#00D2D3"/>
  </g>

  <!-- Group: Corporate Typography -->
  <g transform="translate(122, 0)">
    <!-- Primary Brand Name: meskOra -->
    <text x="0" y="65" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#0F172A">mesk</tspan><tspan fill="#2563EB">O</tspan><tspan fill="#0F172A">ra</tspan>
    </text>

    <!-- Supporting Line: Technologies (Pvt) Ltd -->
    <text x="2" y="93" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="500" 
          letter-spacing="3.4" 
          fill="#475569">
      Technologies (Pvt) Ltd
    </text>
  </g>
</svg>
