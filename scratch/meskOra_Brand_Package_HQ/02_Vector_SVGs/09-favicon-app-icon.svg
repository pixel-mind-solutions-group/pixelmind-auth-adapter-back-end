<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fav-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="fav-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D2D3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container for iOS / Android / Favicon -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="2"/>

  <!-- Optical Favicon Symbol (Bold stroke for small screen legibility) -->
  <g transform="translate(14, 14)" filter="url(#fav-glow)">
    <!-- Left arch of 'm' -->
    <path d="M 22 74 L 22 42 C 22 24, 38 24, 38 42 L 38 74" 
          fill="none" 
          stroke="url(#fav-cyan-blue)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right loop forming 'O' and completing 'm' flow -->
    <path d="M 38 48 
             C 38 28, 54 22, 68 22 
             C 84 22, 94 35, 94 51 
             C 94 67, 84 80, 68 80 
             C 52 80, 42 67, 42 51 
             C 42 41, 48 33, 58 27" 
          fill="none" 
          stroke="url(#fav-blue-deep)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Core Innovation Point -->
    <circle cx="68" cy="51" r="6" fill="#00D2D3"/>
  </g>
</svg>
