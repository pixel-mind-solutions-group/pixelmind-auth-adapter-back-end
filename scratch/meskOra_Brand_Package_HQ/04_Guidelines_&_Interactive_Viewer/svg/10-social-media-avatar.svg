<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="soc-radial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Symbol Gradients -->
    <linearGradient id="soc-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="soc-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="soc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00D2D3" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="url(#soc-radial)"/>

  <!-- Subtle Circular Safe-Zone Guide Ring (Subtle decorative tech accent) -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Centered Symbol (mO Möbius Nexus) -->
  <g transform="translate(110, 105) scale(2.8)" filter="url(#soc-glow)">
    <!-- Left arch of 'm' -->
    <path d="M 22 74 L 22 42 C 22 26, 38 26, 38 42 L 38 74" 
          fill="none" 
          stroke="url(#soc-cyan-blue)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right loop forming 'O' and completing 'm' flow -->
    <path d="M 38 48 
             C 38 30, 54 24, 68 24 
             C 83 24, 93 36, 93 51 
             C 93 66, 83 78, 68 78 
             C 53 78, 43 66, 43 51 
             C 43 42, 48 35, 57 29" 
          fill="none" 
          stroke="url(#soc-blue-deep)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Core Innovation Point -->
    <circle cx="68" cy="51" r="5" fill="#00D2D3"/>
  </g>

  <!-- Centered Brand Identity Text for Social Media Presence -->
  <text x="250" y="420" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="-0.3">
    <tspan fill="#FFFFFF">mesk</tspan><tspan fill="#38BDF8">O</tspan><tspan fill="#FFFFFF">ra</tspan>
  </text>
  
  <text x="250" y="445" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="3.8" 
        fill="#94A3B8">
    TECHNOLOGIES
  </text>
</svg>
