<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="icon-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="icon-blue-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Standalone mO Möbius Nexus Symbol -->
  <g filter="url(#icon-shadow)">
    <!-- Left arch of 'm' -->
    <path d="M 22 74 L 22 42 C 22 26, 38 26, 38 42 L 38 74" 
          fill="none" stroke="url(#icon-cyan-blue)" stroke-width="11" stroke-linecap="round"/>

    <!-- Right loop forming 'O' and completing 'm' flow -->
    <path d="M 38 48 C 38 30, 54 24, 68 24 C 83 24, 93 36, 93 51 C 93 66, 83 78, 68 78 C 53 78, 43 66, 43 51 C 43 42, 48 35, 57 29" 
          fill="none" stroke="url(#icon-blue-deep)" stroke-width="11" stroke-linecap="round"/>

    <!-- Dynamic Innovation Core Node -->
    <circle cx="68" cy="51" r="5" fill="#00D2D3"/>
  </g>
</svg>
