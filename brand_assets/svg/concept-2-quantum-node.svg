<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="c2-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="c2-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="c2-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Isometric Hexagon Node forming structural 'M' with central 'O' aperture -->
  <!-- Top Facet (Slanted Diamond) -->
  <polygon points="50,15 80,32 50,49 20,32" fill="url(#c2-top)"/>
  
  <!-- Left Facet -->
  <polygon points="20,35 48,51 48,85 20,69" fill="url(#c2-left)"/>
  
  <!-- Right Facet -->
  <polygon points="52,51 80,35 80,69 52,85" fill="url(#c2-right)"/>

  <!-- Negative Space / Central Portal: floating intelligent core 'O' -->
  <circle cx="50" cy="50" r="14" fill="#0A192F" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="50" cy="50" r="6" fill="#00D2D3"/>
</svg>
